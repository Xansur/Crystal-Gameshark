name: Release Crystal GameShark

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (example: 0.2.0)"
        required: false
        default: "0.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="0.2.0"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi

          echo "Using version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create mod ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="crystal_gameshark-${VERSION}.zip"

          zip "$ZIP" \
            manifest.json \
            main.lua \
            README.md

          echo "Created $ZIP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Crystal GameShark v${{ steps.version.outputs.version }}"
          files: "crystal_gameshark-${{ steps.version.outputs.version }}.zip"
          generate_release_notes: true