name: Release Crystal GameShark

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (leave blank to use manifest.json)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import json

          with open("manifest.json", encoding="utf-8") as f:
              data = json.load(f)

          print(data["version"])
          PY
          )

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine version."
            exit 1
          fi

          echo "Using version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create mod ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="crystal_gameshark-${VERSION}.zip"

          zip "$ZIP" \
            manifest.json \
            main.lua \
            README.md

          echo "Created $ZIP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Crystal GameShark v${{ steps.version.outputs.version }}"
          files: "crystal_gameshark-${{ steps.version.outputs.version }}.zip"
          generate_release_notes: true